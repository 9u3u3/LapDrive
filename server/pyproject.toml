[project]
name = "lapdrive-server"
version = "1.0.0"
description = "LapDrive: access the files of this laptop from your phone over HTTPS."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "9u3u3" }]
keywords = ["file-sharing", "android", "https", "self-hosted"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "cryptography>=43",
    "qrcode>=8.0",
    "pillow>=11",
    "send2trash>=1.8",
]

[project.urls]
Homepage = "https://github.com/9u3u3/LapDrive"
Issues = "https://github.com/9u3u3/LapDrive/issues"

[project.scripts]
lapdrive = "lapdrive_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["lapdrive_server.py"]
